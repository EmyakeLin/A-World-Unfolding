    // Check sidebar content
    const sidebar = document.getElementById('sidebar');
    if (sidebar) log('Sidebar children: ' + sidebar.children.length);
    
    // Show results overlay
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;overflow:auto;background:rgba(15,23,42,0.95);color:#e2e8f0;font:11px/1.5 monospace;padding:20px;z-index:99999;';
    overlay.innerHTML = '<h2 style="color:#fbbf24;margin-bottom:10px">DIAG Results</h2>' + results.map(r => {
        const color = r.includes('FOUND') ? '#4ade80' : r.includes('MISSING') ? '#f87171' : '#60a5fa';
        return '<div style="color:' + color + '">' + r + '</div>';
    }).join('');
    document.body.appendChild(overlay);
} catch(e) {
    document.body.innerHTML = '<pre style="color:red;padding:20px">ERROR: ' + e.message + '\n' + e.stack + '</pre>';
}
</script>
</body>
</html>
